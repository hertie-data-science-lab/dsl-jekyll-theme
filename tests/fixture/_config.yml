# Fixture site config - see ../README.md.
#
# Layered OVER the theme's own _config.yml, never instead of it:
#
#   bundle exec jekyll build --config _config.yml,tests/fixture/_config.yml
#
# Deliberately no `remote_theme:`. The layouts and includes resolve from THIS checkout, so
# the build tests the code in the pull request rather than whatever is on main.

# --- Site identity, in the shape a NON-course consumer has it: `title` and no semester.
# The course keys are the other shape, and `_includes/head.html` / `header.html` fall back
# from one to the other - so a fixture that set them would never exercise the fallback.
title: "Fixture Site"
description: "A fixture. Not a real site; nothing here is published."
github_org: "hertie-data-science-lab"

# --- Where this fixture's content lives, so it stays out of the theme's own root ---
data_dir: tests/fixture/_data
